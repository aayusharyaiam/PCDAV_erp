services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: pcdav
      POSTGRES_PASSWORD: pcdav_local
      POSTGRES_DB: pcdav
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcdav -d pcdav"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
